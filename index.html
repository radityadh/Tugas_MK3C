<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Kopi Senja Coffee Shop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <div class="login-container">

      <div class="brand">
        <div class="coffee-cup" aria-hidden="true">
          <span class="steam steam1"></span>
          <span class="steam steam2"></span>
          <span class="steam steam3"></span>
          <div class="cup-body"><div class="cup-shine"></div></div>
          <div class="cup-handle"></div>
        </div>
        <h1>Kopi Senja</h1>
        <p class="subtitle">Coffee Shop &amp; Roastery</p>
      </div>

      <form action="#">
        <div class="field">
          <label for="username">Nama Pengguna</label>
          <input type="text" name="username" id="username"
            placeholder="Masukkan Username">
        </div>

        <div class="field">
          <label for="password">Kata Sandi</label>
          <input type="password" name="password" id="password"
            placeholder="Masukkan Kata Sandi">
        </div>

        <button type="button" onclick="cekLogin()">Masuk</button>

        <div class="links">
          <a href="#">Lupa kata sandi anda?</a>
          <span class="dot">•</span>
          <a href="register.html">Daftar Sekarang</a>
        </div>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
